services:

  campanhasapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campanhasapi
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CampanhasDB=Server=sqlserver;Database=CampanhasDB;User Id=sa;Password=Sa12345678!;TrustServerCertificate=True
      - JwtSettings__SecretKey=troque-esta-chave-em-producao-conexao-solidaria-2026
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__VHost=/
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - conexao-solidaria-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Sa12345678!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "Sa12345678!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - conexao-solidaria-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - conexao-solidaria-network

networks:
  conexao-solidaria-network:
    driver: bridge
